name: Auto Backup with Tag

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes
        run: git pull origin main || git pull origin master || true

      - name: Check for changes and push
        id: check_changes
        run: |
          # 检查是否有未提交的变更或未推送的提交
          git fetch origin
          
          # 获取远程最新提交的哈希
          REMOTE_HASH=$(git rev-parse origin/main 2>/dev/null || git rev-parse origin/master 2>/dev/null || echo "")
          # 获取本地最新提交的哈希
          LOCAL_HASH=$(git rev-parse HEAD 2>/dev/null || echo "")
          
          # 如果远程为空或者是初始状态，直接推送
          if [ -z "$REMOTE_HASH" ]; then
            echo "Remote is empty, will push everything"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # 比较本地和远程
          if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
            echo "Local and remote differ, will push"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            # 检查工作区是否有变更
            if git diff --quiet && git diff --cached --quiet; then
              echo "No changes to push"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            else
              echo "Working directory has changes"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Commit and push if needed
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          # 添加所有变更
          git add -A
          
          # 检查是否有实际要提交的内容
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          
          # 生成日期标签
          DATE_TAG=$(date +%y%m%d)
          
          # 获取今日已有的标签数量（从远程获取）
          git fetch origin --tags
          EXISTING_COUNT=$(git tag --list "${DATE_TAG}*" 2>/dev/null | wc -l)
          NEW_COUNT=$((EXISTING_COUNT + 1))
          TAG_NAME="${DATE_TAG}_$(printf '%02d' $NEW_COUNT)"
          
          # 创建提交
          git commit -m "Auto backup: $(date +%Y-%m-%d\ %H:%M:%S)"
          
          # 推送代码
          git push origin main || git push origin master
          
          # 创建并推送标签
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          
          echo "Created and pushed tag: $TAG_NAME"

      - name: Show result
        run: |
          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "Backup completed successfully!"
          else
            echo "No backup needed - repository is up to date."
          fi
