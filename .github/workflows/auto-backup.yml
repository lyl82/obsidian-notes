name: Auto Backup with Tag

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodule: none

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes
        run: |
          git pull origin main || git pull origin master || true

      - name: Fix submodule reference if exists
        run: |
          if git ls-files --stage | grep -q "^160000"; then
            echo "Removing broken submodule reference..."
            git rm --cached -f elon-musk-skill 2>/dev/null || true
          fi

      - name: Check for changes and push
        id: check_changes
        run: |
          git fetch origin

          REMOTE_HASH=$(git rev-parse origin/main 2>/dev/null || git rev-parse origin/master 2>/dev/null || echo "")
          LOCAL_HASH=$(git rev-parse HEAD 2>/dev/null || echo "")

          if [ -z "$REMOTE_HASH" ]; then
            echo "Remote is empty, will push everything"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
            echo "Local and remote differ, will push"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            if git diff --quiet && git diff --cached --quiet; then
              echo "No changes to push"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            else
              echo "Working directory has changes"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Commit and push if needed
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          DATE_TAG=$(date +%y%m%d)

          git fetch origin --tags
          EXISTING_COUNT=$(git tag --list "${DATE_TAG}*" 2>/dev/null | wc -l)
          NEW_COUNT=$((EXISTING_COUNT + 1))
          TAG_NAME="${DATE_TAG}_$(printf '%02d' $NEW_COUNT)"

          git commit -m "Auto backup: $(date +%Y-%m-%d\ %H:%M:%S)"

          git push origin main || git push origin master

          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

          echo "Created and pushed tag: $TAG_NAME"

      - name: Show result
        run: |
          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "Backup completed successfully!"
          else
            echo "No backup needed - repository is up to date."
          fi
