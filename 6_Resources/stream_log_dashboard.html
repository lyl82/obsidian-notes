<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生OS 时间流日志交互看板</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #0b1020;
      color: #e6ecff;
    }
    .container { max-width: 1320px; margin: 0 auto; padding: 16px; }
    .header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .title { font-size: 22px; font-weight: 700; }
    .controls {
      display: grid;
      grid-template-columns: repeat(6, minmax(140px, 1fr));
      gap: 10px;
      background: #121a33;
      border: 1px solid #29345f;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .control { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; color: #9fb0e6; }
    input, select, button {
      height: 34px;
      border-radius: 8px;
      border: 1px solid #31417a;
      background: #0f1730;
      color: #e6ecff;
      padding: 0 10px;
      outline: none;
    }
    button {
      cursor: pointer;
      background: #1a4fff;
      border: none;
      font-weight: 600;
    }
    button.secondary { background: #20305f; border: 1px solid #31417a; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .card {
      background: #121a33;
      border: 1px solid #29345f;
      border-radius: 12px;
      padding: 12px;
    }
    .metric-value { font-size: 22px; font-weight: 700; margin-top: 4px; }
    .metric-label { font-size: 12px; color: #9fb0e6; }
    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .panel-title {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 8px 0;
    }
    .chart {
      width: 100%;
      min-height: 320px;
      background: #0f1730;
      border-radius: 10px;
      border: 1px solid #243464;
      padding: 8px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      font-size: 13px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      table-layout: fixed;
    }
    th, td {
      border-bottom: 1px solid #243464;
      padding: 8px 6px;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    th { color: #9fb0e6; cursor: pointer; }
    .table-wrap {
      background: #121a33;
      border: 1px solid #29345f;
      border-radius: 12px;
      padding: 8px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 12px;
      color: #9fb0e6;
    }
    .small { font-size: 12px; color: #9fb0e6; }
    @media (max-width: 980px) {
      .controls { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
      .metrics { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">人生OS 时间流日志交互看板</div>
      <div class="small" id="statusText">等待载入数据</div>
    </div>

    <div class="controls">
      <div class="control">
        <label>CSV 文件上传</label>
        <input id="fileInput" type="file" accept=".csv">
      </div>
      <div class="control">
        <label>快速加载默认文件</label>
        <button id="loadDefaultBtn">加载当前目录 CSV</button>
      </div>
      <div class="control">
        <label>开始日期</label>
        <input id="startDate" type="date">
      </div>
      <div class="control">
        <label>结束日期</label>
        <input id="endDate" type="date">
      </div>
      <div class="control">
        <label>类别筛选</label>
        <select id="categoryFilter"></select>
      </div>
      <div class="control">
        <label>关键词（标题/描述）</label>
        <input id="keywordInput" type="text" placeholder="例如：面试 / 锻炼">
      </div>
      <div class="control">
        <label>最小时长（分钟）</label>
        <input id="minDuration" type="number" min="0" step="1" value="0">
      </div>
      <div class="control">
        <label>应用过滤</label>
        <button id="applyFilterBtn">刷新看板</button>
      </div>
      <div class="control">
        <label>重置过滤</label>
        <button id="resetBtn" class="secondary">重置</button>
      </div>
    </div>

    <div class="metrics">
      <div class="card"><div class="metric-label">记录条数</div><div class="metric-value" id="mCount">0</div></div>
      <div class="card"><div class="metric-label">总时长（分钟）</div><div class="metric-value" id="mMinutes">0</div></div>
      <div class="card"><div class="metric-label">总时长（小时）</div><div class="metric-value" id="mHours">0</div></div>
      <div class="card"><div class="metric-label">覆盖天数</div><div class="metric-value" id="mDays">0</div></div>
      <div class="card"><div class="metric-label">日均时长（小时）</div><div class="metric-value" id="mAvgDay">0</div></div>
      <div class="card"><div class="metric-label">空描述记录（条）</div><div class="metric-value" id="mEmpty">0</div></div>
    </div>

    <div class="grid">
      <div class="card">
        <h3 class="panel-title">每日记录时长分布</h3>
        <svg id="dailyChart" class="chart" viewBox="0 0 900 320" preserveAspectRatio="none"></svg>
      </div>
      <div class="card">
        <h3 class="panel-title">行动类别占比</h3>
        <div id="categoryLegend" class="chart"></div>
      </div>
    </div>

    <div class="grid">
      <div class="table-wrap">
        <h3 class="panel-title">标题聚合（前 15）</h3>
        <table>
          <thead>
            <tr>
              <th>标题</th>
              <th>时长（分钟）</th>
              <th>次数</th>
            </tr>
          </thead>
          <tbody id="titleBody"></tbody>
        </table>
      </div>
      <div class="table-wrap">
        <h3 class="panel-title">对象标签聚合</h3>
        <table>
          <thead>
            <tr>
              <th>对象标签</th>
              <th>时长（分钟）</th>
              <th>次数</th>
            </tr>
          </thead>
          <tbody id="tagBody"></tbody>
        </table>
      </div>
    </div>

    <div class="table-wrap">
      <h3 class="panel-title">记录明细（可排序）</h3>
      <table>
        <thead>
          <tr>
            <th data-sort="date">日期</th>
            <th data-sort="title">标题</th>
            <th data-sort="category">类别</th>
            <th data-sort="duration">时长（分钟）</th>
            <th>摘要</th>
          </tr>
        </thead>
        <tbody id="recordBody"></tbody>
      </table>
      <div class="footer">
        <div id="recordCountText">0 条</div>
      </div>
    </div>
  </div>

  <script>
    const defaultCsvName = "人生os（1.0）_stream_log_时间实际表_dao-过去48h (1).csv";
    const state = {
      raw: [],
      filtered: [],
      sortField: "date",
      sortAsc: false
    };

    const categoryColors = {
      "求职与面试": "#4f7cff",
      "思考与学习": "#31c48d",
      "锻炼与身体活动": "#f59e0b",
      "娱乐与体验": "#ef4444",
      "生活与物理移动": "#a855f7",
      "模糊或未定义": "#64748b"
    };

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let i = 0;
      let inQuotes = false;
      while (i < text.length) {
        const ch = text[i];
        const next = text[i + 1];
        if (ch === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i += 2;
            continue;
          }
          inQuotes = !inQuotes;
          i++;
          continue;
        }
        if (!inQuotes && ch === ",") {
          row.push(cell);
          cell = "";
          i++;
          continue;
        }
        if (!inQuotes && (ch === "\n" || ch === "\r")) {
          if (ch === "\r" && next === "\n") i++;
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
          i++;
          continue;
        }
        cell += ch;
        i++;
      }
      if (cell.length > 0 || row.length > 0) {
        row.push(cell);
        rows.push(row);
      }
      return rows;
    }

    function parseDateTime(value) {
      if (!value) return null;
      const t = value.trim();
      if (!t) return null;
      const normalized = t.replace(/\//g, "-");
      const d = new Date(normalized);
      if (Number.isNaN(d.getTime())) return null;
      return d;
    }

    function toNum(value) {
      const n = Number(String(value || "").trim());
      return Number.isFinite(n) ? n : 0;
    }

    function classify(r) {
      const text = [r.title, r.log, r.done, r.doing, r.tag].join(" ");
      if (["投递简历", "投简历", "简历", "面试", "自我介绍", "口头表达"].some(k => text.includes(k))) return "求职与面试";
      if (["锻炼", "引体", "深蹲", "骑行", "跑步", "拳击"].some(k => text.includes(k))) return "锻炼与身体活动";
      if (["学习", "发散思考", "思维", "复盘", "蓝图", "管理"].some(k => text.includes(k))) return "思考与学习";
      if (["游戏", "脱口秀", "看视频", "citywalk"].some(k => text.includes(k))) return "娱乐与体验";
      if (["物理移动", "吃饭", "通勤"].some(k => text.includes(k))) return "生活与物理移动";
      return "模糊或未定义";
    }

    function rowsToRecords(rows) {
      if (!rows.length) return [];
      const headers = rows[0];
      const idx = {};
      headers.forEach((h, i) => idx[h.trim()] = i);
      const list = [];
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r || r.length === 0) continue;
        const startRaw = r[idx["初时间"]] || "";
        const endRaw = r[idx["完成时间"]] || "";
        const title = (r[idx["标题"]] || "").trim();
        const log = (r[idx["log描述"]] || "").trim();
        const done = (r[idx["done描述"]] || "").trim();
        const doing = (r[idx["doing 描述"]] || "").trim();
        const tag = (r[idx["对象标签"]] || "").trim();
        let duration = toNum(r[idx["持续时间（整数）"]]);
        const start = parseDateTime(startRaw);
        const end = parseDateTime(endRaw);
        if (duration <= 0 && start && end) duration = (end - start) / 60000;
        duration = Math.max(0, duration);
        const dateStr = start ? start.toISOString().slice(0, 10) : "";
        const category = classify({ title, log, done, doing, tag });
        const summary = [log, done, doing].filter(Boolean).join(" | ").slice(0, 140);
        list.push({
          start,
          end,
          date: dateStr,
          duration,
          title: title || "（空）",
          log, done, doing,
          tag: tag || "（空）",
          category,
          summary: summary || "（空）"
        });
      }
      return list;
    }

    function updateCategoryFilter(records) {
      const select = document.getElementById("categoryFilter");
      const categories = [...new Set(records.map(r => r.category))];
      select.innerHTML = `<option value="全部">全部</option>` + categories.map(c => `<option value="${c}">${c}</option>`).join("");
    }

    function updateDateBounds(records) {
      const dates = records.map(r => r.date).filter(Boolean).sort();
      const startInput = document.getElementById("startDate");
      const endInput = document.getElementById("endDate");
      if (!dates.length) {
        startInput.value = "";
        endInput.value = "";
        return;
      }
      startInput.value = dates[0];
      endInput.value = dates[dates.length - 1];
    }

    function applyFilters() {
      const startDate = document.getElementById("startDate").value;
      const endDate = document.getElementById("endDate").value;
      const category = document.getElementById("categoryFilter").value;
      const keyword = document.getElementById("keywordInput").value.trim();
      const minDuration = Number(document.getElementById("minDuration").value || "0");
      state.filtered = state.raw.filter(r => {
        if (startDate && r.date && r.date < startDate) return false;
        if (endDate && r.date && r.date > endDate) return false;
        if (category && category !== "全部" && r.category !== category) return false;
        if (r.duration < minDuration) return false;
        if (keyword) {
          const text = [r.title, r.log, r.done, r.doing, r.tag, r.category].join(" ");
          if (!text.includes(keyword)) return false;
        }
        return true;
      });
      renderAll();
    }

    function calcMetrics(records) {
      const total = records.reduce((s, r) => s + r.duration, 0);
      const dateSet = new Set(records.map(r => r.date).filter(Boolean));
      const days = dateSet.size;
      const empty = records.filter(r => r.title === "（空）" && !r.log && !r.done && !r.doing).length;
      return {
        count: records.length,
        totalMinutes: total,
        totalHours: total / 60,
        days,
        avgDayHours: days > 0 ? total / 60 / days : 0,
        empty
      };
    }

    function renderMetrics() {
      const m = calcMetrics(state.filtered);
      document.getElementById("mCount").textContent = String(m.count);
      document.getElementById("mMinutes").textContent = m.totalMinutes.toFixed(1);
      document.getElementById("mHours").textContent = m.totalHours.toFixed(2);
      document.getElementById("mDays").textContent = String(m.days);
      document.getElementById("mAvgDay").textContent = m.avgDayHours.toFixed(2);
      document.getElementById("mEmpty").textContent = String(m.empty);
      document.getElementById("recordCountText").textContent = `当前 ${m.count} 条记录`;
    }

    function renderDailyChart() {
      const svg = document.getElementById("dailyChart");
      const grouped = new Map();
      state.filtered.forEach(r => {
        if (!r.date) return;
        grouped.set(r.date, (grouped.get(r.date) || 0) + r.duration);
      });
      const items = [...grouped.entries()].sort((a, b) => a[0].localeCompare(b[0]));
      const width = 900;
      const height = 320;
      const pad = { top: 20, right: 20, bottom: 56, left: 50 };
      if (!items.length) {
        svg.innerHTML = `<text x="50%" y="50%" text-anchor="middle" fill="#9fb0e6">暂无可展示数据</text>`;
        return;
      }
      const maxV = Math.max(...items.map(i => i[1]), 1);
      const innerW = width - pad.left - pad.right;
      const innerH = height - pad.top - pad.bottom;
      const barW = innerW / items.length * 0.7;
      const step = innerW / items.length;
      let html = "";
      html += `<line x1="${pad.left}" y1="${height-pad.bottom}" x2="${width-pad.right}" y2="${height-pad.bottom}" stroke="#39508f"/>`;
      html += `<line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${height-pad.bottom}" stroke="#39508f"/>`;
      items.forEach(([d, v], i) => {
        const h = (v / maxV) * innerH;
        const x = pad.left + i * step + (step - barW) / 2;
        const y = height - pad.bottom - h;
        html += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${barW.toFixed(2)}" height="${h.toFixed(2)}" fill="#4f7cff"><title>${d}: ${v.toFixed(1)} 分钟</title></rect>`;
        html += `<text x="${(x+barW/2).toFixed(2)}" y="${height - pad.bottom + 16}" text-anchor="middle" font-size="10" fill="#9fb0e6">${d.slice(5)}</text>`;
      });
      [0, 0.25, 0.5, 0.75, 1].forEach(r => {
        const y = height - pad.bottom - innerH * r;
        const val = maxV * r;
        html += `<line x1="${pad.left}" y1="${y}" x2="${width-pad.right}" y2="${y}" stroke="#1d2a55"/>`;
        html += `<text x="${pad.left - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="#9fb0e6">${val.toFixed(0)}</text>`;
      });
      svg.innerHTML = html;
    }

    function renderCategoryLegend() {
      const div = document.getElementById("categoryLegend");
      const grouped = new Map();
      state.filtered.forEach(r => grouped.set(r.category, (grouped.get(r.category) || 0) + r.duration));
      const items = [...grouped.entries()].sort((a, b) => b[1] - a[1]);
      const total = items.reduce((s, i) => s + i[1], 0);
      if (!items.length) {
        div.innerHTML = `<div class="small">暂无可展示数据</div>`;
        return;
      }
      div.innerHTML = items.map(([c, m]) => {
        const ratio = total > 0 ? (m / total * 100) : 0;
        const color = categoryColors[c] || "#64748b";
        return `
          <div style="margin-bottom:10px;">
            <div class="legend-item"><span class="dot" style="background:${color};"></span><span>${c}</span></div>
            <div style="height:8px;background:#1d2a55;border-radius:6px;overflow:hidden;">
              <div style="height:8px;width:${ratio.toFixed(1)}%;background:${color};"></div>
            </div>
            <div class="small">${m.toFixed(1)} 分钟 · ${ratio.toFixed(1)}%</div>
          </div>
        `;
      }).join("");
    }

    function renderAggTable(targetId, rows, keyName) {
      const body = document.getElementById(targetId);
      body.innerHTML = rows.map(r => `
        <tr>
          <td title="${r[keyName]}">${r[keyName]}</td>
          <td>${r.minutes.toFixed(1)}</td>
          <td>${r.count}</td>
        </tr>
      `).join("");
    }

    function renderTopTables() {
      const byTitle = new Map();
      const byTag = new Map();
      state.filtered.forEach(r => {
        const t = byTitle.get(r.title) || { title: r.title, minutes: 0, count: 0 };
        t.minutes += r.duration;
        t.count += 1;
        byTitle.set(r.title, t);
        const g = byTag.get(r.tag) || { tag: r.tag, minutes: 0, count: 0 };
        g.minutes += r.duration;
        g.count += 1;
        byTag.set(r.tag, g);
      });
      const titleRows = [...byTitle.values()].sort((a, b) => b.minutes - a.minutes).slice(0, 15);
      const tagRows = [...byTag.values()].sort((a, b) => b.minutes - a.minutes).slice(0, 15);
      renderAggTable("titleBody", titleRows, "title");
      renderAggTable("tagBody", tagRows, "tag");
    }

    function renderRecordTable() {
      const body = document.getElementById("recordBody");
      const list = [...state.filtered];
      const f = state.sortField;
      list.sort((a, b) => {
        let av = a[f];
        let bv = b[f];
        if (f === "duration") {
          av = a.duration;
          bv = b.duration;
        }
        if (av === bv) return 0;
        if (state.sortAsc) return av > bv ? 1 : -1;
        return av > bv ? -1 : 1;
      });
      body.innerHTML = list.map(r => `
        <tr>
          <td>${r.date || "（空）"}</td>
          <td title="${r.title}">${r.title}</td>
          <td>${r.category}</td>
          <td>${r.duration.toFixed(1)}</td>
          <td title="${r.summary}">${r.summary}</td>
        </tr>
      `).join("");
    }

    function renderAll() {
      renderMetrics();
      renderDailyChart();
      renderCategoryLegend();
      renderTopTables();
      renderRecordTable();
      document.getElementById("statusText").textContent = `已加载 ${state.raw.length} 条，当前过滤后 ${state.filtered.length} 条`;
    }

    async function loadFromDefaultFile() {
      try {
        const url = encodeURI(defaultCsvName);
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        ingestCsvText(text);
      } catch (err) {
        document.getElementById("statusText").textContent = `默认文件加载失败：${err.message}`;
      }
    }

    function ingestCsvText(text) {
      const rows = parseCsv(text);
      const records = rowsToRecords(rows);
      state.raw = records;
      updateCategoryFilter(records);
      updateDateBounds(records);
      applyFilters();
    }

    document.getElementById("fileInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      ingestCsvText(text);
    });

    document.getElementById("applyFilterBtn").addEventListener("click", applyFilters);
    document.getElementById("resetBtn").addEventListener("click", () => {
      updateDateBounds(state.raw);
      document.getElementById("categoryFilter").value = "全部";
      document.getElementById("keywordInput").value = "";
      document.getElementById("minDuration").value = "0";
      applyFilters();
    });
    document.getElementById("loadDefaultBtn").addEventListener("click", loadFromDefaultFile);

    document.querySelectorAll("th[data-sort]").forEach(th => {
      th.addEventListener("click", () => {
        const field = th.getAttribute("data-sort");
        if (state.sortField === field) state.sortAsc = !state.sortAsc;
        else {
          state.sortField = field;
          state.sortAsc = false;
        }
        renderRecordTable();
      });
    });

    loadFromDefaultFile();
  </script>
</body>
</html>
